databases:
  - name: vve-db
    databaseName: vve_beheer
    user: vve_user
    plan: free

services:
  - type: web
    name: VvE-beheer
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vve-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
